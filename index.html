<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Borç & Alacak Takip Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0b0f17;
            --card-bg: #161f2e;
            --card-border: #232f45;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-yellow: #f59e0b;
            --accent-blue: #3b82f6;
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 90px; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 480px; padding: 16px; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .header h1 { font-size: 1.3rem; font-weight: 700; }
        .privacy-btn { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-main); padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; }

        .top-stat-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .stat-label { font-size: 0.8rem; color: var(--text-muted); }
        .stat-value { font-size: 1.3rem; font-weight: 800; }
        .blur-val { filter: blur(5px); }

        .card-list { display: flex; flex-direction: column; gap: 12px; }
        .item-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
        }
        .item-card.urgent { border-color: var(--accent-red); }
        .urgent-banner { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); font-size: 0.7rem; font-weight: 700; padding: 4px 8px; border-radius: 6px; margin-bottom: 4px; display: inline-block; }

        .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .avatar-title { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 40px; height: 40px; border-radius: 10px; background: #232f45; color: var(--accent-blue); font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; text-transform: uppercase; }
        .title-box h3 { font-size: 0.95rem; font-weight: 600; }
        .title-box p { font-size: 0.75rem; color: var(--text-muted); }
        .amount { font-size: 1.05rem; font-weight: 700; text-align: right; }

        .card-details { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 0.75rem; color: var(--text-muted); background: rgba(0,0,0,0.2); padding: 8px; border-radius: 8px; }

        .card-bottom { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 8px; }
        .btn-pay { background: var(--accent-green); color: white; border: none; padding: 6px 12px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.75rem; }
        .btn-pay-asgari { background: var(--accent-yellow); color: black; border: none; padding: 6px 12px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.75rem; margin-right: 4px; }

        .bottom-nav {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 480px; background: #0f172a;
            border-top: 1px solid var(--card-border);
            display: flex; justify-content: space-around; padding: 10px 0; z-index: 100;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); font-size: 0.7rem; cursor: pointer; gap: 4px; }
        .nav-item.active { color: var(--accent-green); font-weight: 600; }

        .fab { position: fixed; bottom: 70px; right: 20px; width: 50px; height: 50px; border-radius: 50%; background: var(--accent-green); color: white; border: none; font-size: 1.8rem; cursor: pointer; box-shadow: 0 4px 12px rgba(16,185,129,0.4); display: flex; align-items: center; justify-content: center; z-index: 99; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 200; align-items: center; justify-content: center; padding: 16px; }
        .modal-content { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; width: 100%; max-width: 420px; padding: 20px; display: flex; flex-direction: column; gap: 10px; max-height: 90vh; overflow-y: auto; }
        .modal-content input, .modal-content select { width: 100%; padding: 10px; background: var(--bg-color); border: 1px solid var(--card-border); border-radius: 8px; color: white; font-size: 0.85rem; }
        .modal-content label { font-size: 0.75rem; color: var(--text-muted); margin-bottom: -6px; }
        .btn-submit { background: var(--accent-green); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 8px; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .ai-banner { background: linear-gradient(135deg, #3b82f611, #10b98111); border: 1px dashed var(--accent-blue); border-radius: 12px; padding: 10px; text-align: center; cursor: pointer; font-size: 0.8rem; color: var(--accent-blue); font-weight: 600; margin-bottom: 12px; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>Borç & Gelir Takip</h1>
        <button class="privacy-btn" onclick="toggleBlur()">👁 Göz</button>
    </div>

    <!-- BORÇLAR SEKMESİ -->
    <div id="tab-borclar" class="tab-content active">
        <div class="top-stat-card">
            <div>
                <div class="stat-label">Toplam Kalan Borç</div>
                <div class="stat-value val-txt" id="totalDebtVal" style="color: var(--accent-red)">₺0</div>
            </div>
            <div style="text-align: right;">
                <div class="stat-label">Yaklaşan Ödeme</div>
                <div class="stat-value val-txt" id="nextPayVal" style="color: var(--accent-yellow); font-size:1rem;">-</div>
            </div>
        </div>

        <div class="ai-banner" onclick="triggerAI()">
            📷 Ekstre Görseli / Fotoğraf Yükle (AI Otomatik Doldur)
        </div>

        <div class="card-list" id="borclarList"></div>
    </div>

    <!-- ALACAKLAR SEKMESİ -->
    <div id="tab-alacaklar" class="tab-content">
        <div class="top-stat-card">
            <div>
                <div class="stat-label">Toplam Alacak</div>
                <div class="stat-value val-txt" id="totalIncomeVal" style="color: var(--accent-green)">₺0</div>
            </div>
        </div>
        <div class="card-list" id="alacaklarList"></div>
    </div>

    <!-- GEÇMİŞ SEKMESİ -->
    <div id="tab-gecmis" class="tab-content">
        <div class="header"><h2>Ödeme Geçmişi</h2></div>
        <div class="card-list" id="gecmisList"></div>
    </div>

    <!-- GRAFİK SEKMESİ -->
    <div id="tab-grafik" class="tab-content">
        <div class="header"><h2>Borç / Gelir Analizi</h2></div>
        <div class="top-stat-card" style="flex-direction: column; align-items: flex-start; gap: 8px;">
            <canvas id="myChart" style="width:100%; max-height:250px; margin-top:10px;"></canvas>
        </div>
    </div>
</div>

<button class="fab" onclick="openModal()">+</button>

<!-- MODEL DIALOG -->
<div class="modal" id="addModal">
    <div class="modal-content">
        <h3>Yeni Kayıt Ekle</h3>
        <select id="modalType" onchange="toggleFormFields()">
            <option value="borc">Borç / Kredi Kartı / Taksit</option>
            <option value="kira">Düzenli Kira Ödemesi</option>
            <option value="gelir">Gelir / Alacak</option>
        </select>
        
        <label>Banka Adı & Kart Tipi</label>
        <input type="text" id="modalBank" placeholder="Örn: Garanti BBVA - World / Axess / Enpara">
        
        <label>Açıklama / Başlık</label>
        <input type="text" id="modalTitle" placeholder="Örn: Kredi Kartı Ekstresi / Ev Kirası">
        
        <label>Kategori</label>
        <select id="modalCategory">
            <option value="Kredi Kartı">Kredi Kartı</option>
            <option value="Kira">Kira</option>
            <option value="Kredi Taksidi">Kredi Taksidi</option>
            <option value="Fatura">Fatura</option>
            <option value="Diğer">Diğer</option>
        </select>

        <label>Dönem Borcu (Toplam Tutar)</label>
        <input type="number" id="modalAmount" placeholder="₺0.00">

        <div id="kkFields">
            <label>Asgari Ödeme Tutarı</label>
            <input type="number" id="modalMin" placeholder="₺0.00">
            
            <label>Hesap Kesim Tarihi</label>
            <input type="date" id="modalKesim">
        </div>

        <div id="taksitFields" style="display:none;">
            <label>Taksit Sayısı (Örn: 12)</label>
            <input type="number" id="modalTotalTaksit" placeholder="12">
            <label>Mevcut Taksit (Örn: 1)</label>
            <input type="number" id="modalCurrentTaksit" placeholder="1">
        </div>

        <label>Son Ödeme Tarihi</label>
        <input type="date" id="modalDate">

        <button class="btn-submit" onclick="saveItem()">Sisteme Kaydet</button>
        <button onclick="closeModal()" style="background:transparent; border:none; color:var(--text-muted); cursor:pointer;">İptal</button>
    </div>
</div>

<!-- ALT MENÜ -->
<div class="bottom-nav">
    <div class="nav-item active" onclick="switchTab('borclar', this)">
        <span>💳 Borçlar</span>
    </div>
    <div class="nav-item" onclick="switchTab('alacaklar', this)">
        <span>💰 Alacaklar</span>
    </div>
    <div class="nav-item" onclick="switchTab('gecmis', this)">
        <span>📜 Geçmiş</span>
    </div>
    <div class="nav-item" onclick="switchTab('grafik', this)">
        <span>📊 Grafik</span>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('finans_pro_db')) || [];
    let isBlurred = false;

    if ("Notification" in window) { Notification.requestPermission(); }

    function toggleBlur() {
        isBlurred = !isBlurred;
        document.querySelectorAll('.val-txt').forEach(el => el.classList.toggle('blur-val', isBlurred));
    }

    function toggleFormFields() {
        const type = document.getElementById('modalType').value;
        document.getElementById('kkFields').style.display = (type === 'borc') ? 'block' : 'none';
        document.getElementById('taksitFields').style.display = (type === 'borc') ? 'block' : 'none';
    }

    function openModal() { document.getElementById('addModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('addModal').style.display = 'none'; }

    function triggerAI() {
        alert("Gemini 3 Flash Ekstre Tarama: Fotoğraf seçildiğinde banka, asgari ödeme ve tarihler otomatik forma dolacaktır.");
        openModal();
    }

    function saveItem() {
        const type = document.getElementById('modalType').value;
        const bank = document.getElementById('modalBank').value || 'Diğer';
        const title = document.getElementById('modalTitle').value;
        const category = document.getElementById('modalCategory').value;
        const amount = parseFloat(document.getElementById('modalAmount').value) || 0;
        const min = parseFloat(document.getElementById('modalMin').value) || 0;
        const kesim = document.getElementById('modalKesim').value;
        const date = document.getElementById('modalDate').value;
        const totalTaksit = parseInt(document.getElementById('modalTotalTaksit').value) || 0;
        const currentTaksit = parseInt(document.getElementById('modalCurrentTaksit').value) || 0;

        if(!title || !amount || !date) return alert("Lütfen başlık, tutar ve son ödeme tarihini eksiksiz girin.");

        db.push({
            id: Date.now(), type, bank, title, category, amount, remainingAmount: amount,
            min, kesim, date, totalTaksit, currentTaksit, status: 'pending', payments: []
        });

        localStorage.setItem('finans_pro_db', JSON.stringify(db));
        closeModal();
        render();
    }

    function payPartial(id, isAsgari = false) {
        const item = db.find(i => i.id === id);
        let payVal = isAsgari ? item.min : parseFloat(prompt("Ödemek istediğiniz tutarı girin (TL):", item.remainingAmount));
        
        if(!payVal || isNaN(payVal)) return;

        item.remainingAmount -= payVal;
        item.payments.push({ amount: payVal, date: new Date().toLocaleDateString('tr-TR') });

        if(item.remainingAmount <= 0) {
            item.status = 'completed';
            item.remainingAmount = 0;
            
            // KİRA VEYA TAKSİT İLERİ TAŞIMA
            if(item.type === 'kira') {
                let nextDate = new Date(item.date);
                nextDate.setMonth(nextDate.getMonth() + 1);
                db.push({...item, id: Date.now(), status: 'pending', amount: item.amount, remainingAmount: item.amount, date: nextDate.toISOString().split('T')[0], payments: []});
            } else if(item.totalTaksit > 0 && item.currentTaksit < item.totalTaksit) {
                let nextDate = new Date(item.date);
                nextDate.setMonth(nextDate.getMonth() + 1);
                db.push({...item, id: Date.now(), status: 'pending', currentTaksit: item.currentTaksit + 1, remainingAmount: item.amount, date: nextDate.toISOString().split('T')[0], payments: []});
            }
        }

        localStorage.setItem('finans_pro_db', JSON.stringify(db));
        render();
    }

    function render() {
        const borclarContainer = document.getElementById('borclarList');
        const alacaklarContainer = document.getElementById('alacaklarList');
        const gecmisContainer = document.getElementById('gecmisList');

        borclarContainer.innerHTML = ''; alacaklarContainer.innerHTML = ''; gecmisContainer.innerHTML = '';

        let totalDebt = 0; let totalIncome = 0;
        const today = new Date();

        // Tarihe göre yakın olanı üstte tut
        db.sort((a,b) => new Date(a.date) - new Date(b.date));

        db.forEach(item => {
            const daysLeft = Math.ceil((new Date(item.date) - today) / (1000 * 60 * 60 * 24));
            const isUrgent = daysLeft <= 2 && item.status === 'pending';

            if(isUrgent && Notification.permission === "granted") {
                new Notification("Borç Hatırlatıcı", { body: `${item.title} borcunun ödemesine ${daysLeft} gün kaldı!` });
            }

            if(item.status === 'completed') {
                gecmisContainer.innerHTML += `
                    <div class="item-card">
                        <div class="card-top">
                            <div class="avatar-title">
                                <div class="avatar">${item.bank.substring(0,2)}</div>
                                <div class="title-box"><h3>${item.title}</h3><p>${item.bank} - ${item.category}</p></div>
                            </div>
                            <div class="amount val-txt" style="color:var(--accent-green)">₺${item.amount.toLocaleString('tr-TR')}</div>
                        </div>
                        <div class="card-details">
                            <span>Son Ödeme: ${item.date}</span>
                            <span style="color:var(--accent-green)">✓ Ödendi / Kapatıldı</span>
                        </div>
                    </div>`;
            } else if(item.type === 'borc' || item.type === 'kira') {
                totalDebt += item.remainingAmount;
                borclarContainer.innerHTML += `
                    <div class="item-card ${isUrgent ? 'urgent' : ''}">
                        ${isUrgent ? `<div class="urgent-banner">⚠️ DİKKAT: Ödemeye ${daysLeft} Gün Kaldı!</div>` : ''}
                        <div class="card-top">
                            <div class="avatar-title">
                                <div class="avatar">${item.bank.substring(0,2)}</div>
                                <div class="title-box">
                                    <h3>${item.title}</h3>
                                    <p>${item.bank} | ${item.category} ${item.totalTaksit ? `(${item.currentTaksit}/${item.totalTaksit} Taksit)` : ''}</p>
                                </div>
                            </div>
                            <div class="amount">
                                <div class="val-txt" style="color:var(--accent-red)">₺${item.remainingAmount.toLocaleString('tr-TR')}</div>
                                <div style="font-size:0.7rem; color:var(--text-muted)">Toplam: ₺${item.amount.toLocaleString('tr-TR')}</div>
                            </div>
                        </div>
                        <div class="card-details">
                            <span>Hesap Kesim: ${item.kesim || '-'}</span>
                            <span>Son Ödeme: <b>${item.date}</b></span>
                            <span>Asgari Borç: ₺${item.min || 0}</span>
                            <span>Kalan Bakiye: ₺${item.remainingAmount}</span>
                        </div>
                        <div class="card-bottom">
                            <div>
                                ${item.min > 0 ? `<button class="btn-pay-asgari" onclick="payPartial(${item.id}, true)">Asgari Öde</button>` : ''}
                                <button class="btn-pay" style="background:#232f45" onclick="payPartial(${item.id}, false)">Kısmi Öde</button>
                            </div>
                            <button class="btn-pay" onclick="payPartial(${item.id}, false)">Tamamını Kapat</button>
                        </div>
                    </div>`;
            } else if(item.type === 'gelir') {
                totalIncome += item.remainingAmount;
                alacaklarContainer.innerHTML += `
                    <div class="item-card">
                        <div class="card-top">
                            <div class="avatar-title">
                                <div class="avatar" style="color:var(--accent-green)">₺</div>
                                <div class="title-box"><h3>${item.title}</h3><p>${item.category}</p></div>
                            </div>
                            <div class="amount val-txt" style="color:var(--accent-green)">₺${item.remainingAmount.toLocaleString('tr-TR')}</div>
                        </div>
                        <div class="card-bottom">
                            <span>Beklenen Tarih: ${item.date}</span>
                            <button class="btn-pay" onclick="payPartial(${item.id}, false)">Tahsil Et</button>
                        </div>
                    </div>`;
            }
        });

        document.getElementById('totalDebtVal').innerText = '₺' + totalDebt.toLocaleString('tr-TR');
        document.getElementById('totalIncomeVal').innerText = '₺' + totalIncome.toLocaleString('tr-TR');
        if(isBlurred) toggleBlur();
    }

    function switchTab(tabName, el) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById('tab-' + tabName).classList.add('active');
        el.classList.add('active');
        if(tabName === 'grafik') renderChart();
    }

    let chartInstance = null;
    function renderChart() {
        const ctx = document.getElementById('myChart').getContext('2d');
        if(chartInstance) chartInstance.destroy();

        const pending = db.filter(i => i.status==='pending' && i.type!=='gelir').reduce((a,b)=>a+b.remainingAmount,0);
        const completed = db.filter(i => i.status==='completed').reduce((a,b)=>a+b.amount,0);
        const income = db.filter(i => i.type==='gelir').reduce((a,b)=>a+b.amount,0);

        chartInstance = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Açık Borçlar', 'Ödenen Borçlar', 'Alacaklar'],
                datasets: [{
                    data: [pending, completed, income],
                    backgroundColor: ['#ef4444', '#10b981', '#3b82f6']
                }]
            },
            options: { plugins: { legend: { labels: { color: '#f3f4f6' } } } }
        });
    }

    render();
</script>
</body>
</html>
