<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borç & Alacak Takip</title>
    <style>
        :root {
            --bg-color: #12181f;
            --card-bg: #1e2631;
            --text-color: #f1f5f9;
            --accent-color: #3b82f6;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --border-color: #334155;
            --input-bg: #0f172a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.2rem;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-card {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .stat-title {
            font-size: 0.75rem;
            color: #94a3b8;
            text-transform: uppercase;
            font-weight: 600;
        }

        .stat-value {
            font-size: 1.3rem;
            font-weight: bold;
            margin-top: 5px;
        }

        .stat-value.red { color: #f87171; }
        .stat-value.yellow { color: #facc15; }
        .stat-value.green { color: #4ade80; }
        .stat-value.blue { color: #60a5fa; }

        .ai-box {
            border: 2px dashed #3b82f6;
            background: rgba(59, 130, 246, 0.05);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            margin-bottom: 20px;
        }

        .ai-title {
            font-weight: bold;
            color: #60a5fa;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .file-upload-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            display: inline-block;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .status-msg {
            font-size: 0.8rem;
            margin-top: 8px;
            color: #4ade80;
            display: none;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 4px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: white;
            font-size: 0.95rem;
            box-sizing: border-box;
        }

        button.submit-btn {
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>💳 Borç & Alacak Takip</h1>
    </div>

    <!-- Özet Kartları -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-title">Toplam Borç</div>
            <div class="stat-value red" id="totalDebtDisplay">₺0</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">Bu Dönem Asgari</div>
            <div class="stat-value yellow" id="totalMinDisplay">₺0</div>
        </div>
    </div>

    <!-- Ekstre Okuyucu AI Kutusu -->
    <div class="ai-box">
        <div class="ai-title">🤖 Gemini Ekstre Okuyucu</div>
        <label class="file-upload-btn">
            📸 Ekran Görüntüsü Yükle
            <input type="file" id="imageInput" accept="image/*" style="display: none;">
        </label>
        <div class="status-msg" id="statusMsg">⏳ Ekstre analiz ediliyor...</div>
    </div>

    <!-- Veri Giriş Formu -->
    <form id="debtForm">
        <div class="form-group">
            <label>İşlem Türü</label>
            <select id="kategoriSelect">
                <option value="Borç / Kredi Kartı">Borç / Kredi Kartı</option>
                <option value="Kira (Sürekli)">Kira (Sürekli)</option>
                <option value="Alacak">Alacak</option>
            </select>
        </div>

        <div class="form-group">
            <label>Banka / Kurum</label>
            <input type="text" id="bankaInput" placeholder="Örn: İş Bankası">
        </div>

        <div class="form-group">
            <label>Kart / Açıklama</label>
            <input type="text" id="kartInput" placeholder="Örn: Maximum">
        </div>

        <div class="form-group">
            <label>Güncel Borç / Tutar (₺)</label>
            <input type="number" step="0.01" id="tutarInput" placeholder="0.00">
        </div>

        <div class="form-group">
            <label>Kalan Minimum Ödeme / Asgari (₺)</label>
            <input type="number" step="0.01" id="asgariInput" placeholder="0.00">
        </div>

        <div class="form-group">
            <label>Hesap Kesim / Ödeme Tarihi</label>
            <input type="text" id="tarihInput" placeholder="GG/AA/YYYY veya YYYY-AA-GG">
        </div>

        <button type="submit" class="submit-btn">Kaydet</button>
    </form>
</div>

<script>
    // Görsel Yükleme ve Gemini API Entegrasyonu
    document.getElementById('imageInput').addEventListener('change', async function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const statusMsg = document.getElementById('statusMsg');
        statusMsg.style.display = 'block';
        statusMsg.style.color = '#facc15';
        statusMsg.innerText = '⏳ Ekran görüntüsü analiz ediliyor...';

        const reader = new FileReader();
        reader.onload = async function(event) {
            const base64Image = event.target.result.split(',')[1];
            await analyzeStatementImage(base64Image);
        };
        reader.readAsDataURL(file);
    });

    async function analyzeStatementImage(base64Image) {
        const statusMsg = document.getElementById('statusMsg');

        // Gemini Prompt: Türk Bankalarının mobil ekranlarını hassas okuma talimatı
        const promptText = `
            Sen bir finansal ekstre analiz asistanısın. Görseldeki banka/kredi kartı ekran görüntüsünü dikkatlice oku.

            GÖRSELDEKİ VERİLERİ ŞU KURALLARA GÖRE BUK VE ÇIKAR:
            1. Banka Adı (bankName): Tasarımdan, logodan veya metinlerden tespit et. (Örn: İş Bankası, Garanti BBVA, Akbank, Yapı Kredi vb.)
            2. Kart/Açıklama (cardName): Varsa kart türünü tespit et (Örn: Maximum, World, Axess, Sanal Kredi Kartı vb.), yoksa 'Kredi Kartı' yaz.
            3. Borç Tutarı (totalAmount): 
               - Eğer "Güncel dönem borcu" yazıyorsa öncelikle BUMU AL.
               - Yoksa "Son ekstre borcu" veya "Toplam borç" yazan yerdeki rakamı al.
               - Sadece sayısal değer döndür (Örn: 14771.15).
            4. Asgari / Minimum Tutar (minPayment):
               - "Kalan minimum ödeme tutarı" veya "Asgari ödeme" yazan yerdeki değeri al.
               - Eğer 0,00 TL yazıyorsa 0 döndür.
            5. Tarih (cutoffDate):
               - "Ekstre kesim tarihi" veya "Son ödeme tarihi" bilgisini oku (Örn: 01/09/2026 ise '2026-09-01' formatında veya direkt metin olarak çıkar).

            SADECE aşağıdaki JSON formatında yanıt dön. Yanına veya üstüne başka hiçbir açıklama yazma:
            {
              "category": "Borç / Kredi Kartı",
              "bankName": "İş Bankası",
              "cardName": "Maximum",
              "totalAmount": 14771.15,
              "minPayment": 0,
              "cutoffDate": "2026-09-01"
            }
        `;

        try {
            // Ücretsiz ve güncel Gemini Flash Modeli
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=YOUR_GEMINI_API_KEY_HERE`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { text: promptText },
                            { inlineData: { mimeType: "image/jpeg", data: base64Image } }
                        ]
                    }]
                })
            });

            const result = await response.json();
            const responseText = result.candidates[0].content.parts[0].text;
            
            // JSON Temizleme
            const cleanJsonText = responseText.replace(/```json|```/g, "").trim();
            const data = JSON.parse(cleanJsonText);

            // Formu Doldur
            document.getElementById('kategoriSelect').value = data.category || "Borç / Kredi Kartı";
            document.getElementById('bankaInput').value = data.bankName || "";
            document.getElementById('kartInput').value = data.cardName || "";
            document.getElementById('tutarInput').value = data.totalAmount || 0;
            document.getElementById('asgariInput').value = data.minPayment || 0;
            document.getElementById('tarihInput').value = data.cutoffDate || "";

            statusMsg.style.color = '#4ade80';
            statusMsg.innerText = '✅ Veriler başarıyla aktarıldı!';

        } catch (error) {
            console.error(error);
            statusMsg.style.color = '#ef4444';
            statusMsg.innerText = '❌ Okuma hatası! Lütfen değerleri elle kontrol edin.';
        }
    }
</script>

</body>
</html>
